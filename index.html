<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>机器人识别小游戏</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
      background:
        radial-gradient(600px 420px at 12% 6%, rgba(99,102,241,.12), transparent 60%),
        radial-gradient(520px 360px at 90% 94%, rgba(34,211,238,.12), transparent 60%),
        linear-gradient(165deg, #f8fafc 0%, #eef2f7 100%);
      background-attachment: fixed;
      min-height: 100vh; color: #1e293b;
      display: flex; align-items: center; justify-content: center; padding: 16px;
    }
    .card {
      width: 100%; max-width: 520px; background: #ffffff;
      border-radius: 24px; padding: 24px;
      box-shadow: 0 12px 40px rgba(30,41,59,.10), 0 2px 8px rgba(30,41,59,.04);
      border: 1px solid #e2e8f0;
    }
    .title { text-align: center; font-size: 27px; font-weight: 800; letter-spacing: 1px; color: #1e293b; }
    .subtitle { text-align: center; color: #64748b; margin: 8px 0 22px; font-size: 14px; }
    .btn {
      display: block; width: 100%; padding: 15px; margin-top: 12px;
      border: none; border-radius: 14px; font-size: 16px; cursor: pointer;
      background: linear-gradient(135deg, #6366f1, #4f46e5); color: #fff; font-weight: 600;
      box-shadow: 0 4px 14px rgba(99,102,241,.25);
      transition: transform .12s ease, box-shadow .2s ease, background .2s ease;
    }
    .btn:hover { transform: translateY(-1px); box-shadow: 0 6px 18px rgba(99,102,241,.35); }
    .btn:active { transform: scale(.98); }
    .btn.secondary { background: #f1f5f9; color: #475569; box-shadow: none; border: 1px solid #e2e8f0; }
    .btn.secondary:hover { background: #e8eef6; transform: translateY(-1px); box-shadow: 0 4px 12px rgba(30,41,59,.08); }
    .btn:disabled { background: #e2e8f0; color: #94a3b8; cursor: default; box-shadow: none; }

    /* 状态栏 */
    .status { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
    .status .meta { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: #64748b; }
    .status .score { color: #f59e0b; font-weight: 800; font-size: 18px; }
    .status .meta .q-brand { color: #4f46e5; font-weight: 700; }
    .bar { flex: 1; height: 8px; background: #e2e8f0; border-radius: 4px; overflow: hidden; }
    .bar > div { height: 100%; width: 0; background: linear-gradient(90deg, #6366f1, #22d3ee); border-radius: 4px; transition: width .35s ease; }

    /* 照片区 */
    .photo-box {
      position: relative; height: 320px; background: #eef2f7; border-radius: 20px;
      display: flex; align-items: center; justify-content: center; overflow: hidden;
      border: 1px solid #e2e8f0; margin-bottom: 16px;
    }
    .photo-box img { max-width: 100%; max-height: 100%; object-fit: contain; display: none; }
    .placeholder {
      position: absolute; inset: 0; display: none;
      align-items: center; justify-content: center; flex-direction: column;
      color: #64748b; font-size: 15px; gap: 6px;
    }
    .placeholder .pno { font-size: 12px; color: #94a3b8; letter-spacing: 1px; }
    .placeholder .pmodel { font-weight: 600; color: #64748b; }

    /* 题干 + 选项 */
    .question { text-align: center; font-size: 16px; font-weight: 600; color: #334155; margin-bottom: 14px; }
    .options { display: flex; flex-direction: column; gap: 10px; }
    .option {
      display: flex; align-items: center; gap: 12px; width: 100%;
      padding: 14px 16px; background: #f8fafc; border: 1px solid #e2e8f0;
      border-radius: 14px; cursor: pointer; text-align: left; font-size: 15px;
      transition: border-color .15s ease, background .15s ease, transform .12s ease, box-shadow .15s ease;
    }
    .option:hover { border-color: #6366f1; background: #eef2ff; transform: translateY(-1px); box-shadow: 0 4px 12px rgba(99,102,241,.12); }
    .option .letter {
      width: 28px; height: 28px; border-radius: 50%; background: #e2e8f0; color: #475569;
      display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; flex-shrink: 0;
    }
    .option .txt { display: flex; flex-direction: column; }
    .option .m { font-weight: 600; color: #1e293b; }
    .option .b { font-size: 12px; color: #64748b; }
    .option.correct { border-color: #22c55e; background: #f0fdf4; }
    .option.correct .letter { background: #22c55e; color: #fff; }
    .option.wrong { border-color: #ef4444; background: #fef2f2; }
    .option.wrong .letter { background: #ef4444; color: #fff; }
    .option.dim { opacity: .4; }
    .option:disabled { cursor: default; }
    .option:disabled:hover { border-color: #e2e8f0; background: #f8fafc; transform: none; box-shadow: none; }

    /* 反馈卡片 */
    .feedback { display: none; margin-top: 14px; padding: 16px; border-radius: 16px; }
    .feedback.right { display: block; background: #f0fdf4; border: 1px solid #86efac; }
    .feedback.right .fb-title { color: #16a34a; }
    .feedback.wrong { display: block; background: #fef2f2; border: 1px solid #fca5a5; }
    .feedback.wrong .fb-title { color: #dc2626; }
    .feedback .fb-title { font-weight: 700; font-size: 16px; margin-bottom: 6px; }
    .feedback .fb-ans { color: #334155; font-size: 14px; margin-bottom: 6px; }
    .feedback .fb-feature { color: #64748b; font-size: 13px; line-height: 1.6; }

    /* 学习模式（图鉴翻卡） */
    .btn-link { background: none; border: none; color: #64748b; cursor: pointer; font-size: 14px; padding: 4px 8px; border-radius: 8px; transition: background .15s ease, color .15s ease; }
    .btn-link:hover { color: #4f46e5; background: #eef2ff; }
    .status .btn-link { margin-left: auto; }
    .study-name { text-align: center; font-size: 24px; font-weight: 800; margin-bottom: 8px; color: #1e293b; }
    .study-tags { text-align: center; margin-bottom: 10px; }
    .study-tags .tag {
      display: inline-block; background: #eef2ff; color: #4f46e5;
      padding: 4px 14px; border-radius: 999px; font-size: 12px; font-weight: 600; margin: 0 3px;
    }
    .study-feature {
      text-align: center; color: #475569; font-size: 14px; line-height: 1.7;
      margin: 4px 0 16px; min-height: 44px;
    }
    .study-nav { display: flex; gap: 10px; }
    .study-nav .btn { margin-top: 0; }

    /* 品牌选择页 */
    .brand-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
      max-height: 58vh; overflow-y: auto; padding-right: 4px;
    }
    .brand-grid .brand-btn {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      padding: 13px 14px; background: #f8fafc; border: 1px solid #e2e8f0;
      border-radius: 14px; cursor: pointer; color: #1e293b; font-size: 14px; font-weight: 500;
      transition: border-color .15s ease, background .15s ease, transform .12s ease, box-shadow .15s ease;
    }
    .brand-grid .brand-btn:hover { border-color: #6366f1; background: #eef2ff; transform: translateY(-1px); box-shadow: 0 4px 12px rgba(99,102,241,.12); }
    .brand-grid .brand-btn .count { font-size: 12px; color: #64748b; background: #e2e8f0; padding: 2px 10px; border-radius: 999px; flex-shrink: 0; }

    /* 结果页 */
    .result-num { text-align: center; font-size: 52px; font-weight: 800; color: #f59e0b; margin: 10px 0 4px; }
    .result-sub { text-align: center; color: #64748b; margin-bottom: 16px; }

    /* 页面切换动画 */
    .screen { display: none; }
    .screen.active { display: block; animation: fadeUp .28s ease; }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="card">

    <!-- 开始页 -->
    <section id="screen-start" class="screen active">
      <h1 class="title">🤖 机器人识别</h1>
      <p class="subtitle">先看图学习，再挑战四选一</p>
      <button class="btn" id="btn-learn">📖 学习模式</button>
      <button class="btn secondary" id="btn-start">🎯 考试模式</button>
    </section>

    <!-- 品牌选择页（学习/考试共用） -->
    <section id="screen-brands" class="screen">
      <div class="status">
        <div class="meta"><span id="b-title">选择品牌 · 学习模式</span></div>
        <button class="btn-link" id="btn-brands-back">返回</button>
      </div>
      <div class="brand-grid" id="b-grid"></div>
    </section>

    <!-- 学习模式页（图鉴翻卡） -->
    <section id="screen-study" class="screen">
      <div class="status">
        <div class="meta"><span id="s-progress">第 1/178 台</span></div>
        <button class="btn-link" id="btn-study-back">返回</button>
      </div>
      <div class="photo-box">
        <img id="study-photo" alt="机器人照片">
        <div class="placeholder" id="study-placeholder">
          <span class="pno" id="s-no"></span>
          <span class="pmodel" id="s-model"></span>
        </div>
      </div>
      <div class="study-name" id="s-name"></div>
      <div class="study-tags" id="s-tags"></div>
      <div class="study-feature" id="s-feature"></div>
      <div class="study-nav">
        <button class="btn secondary" id="btn-s-prev">◀ 上一台</button>
        <button class="btn" id="btn-s-next">下一台 ▶</button>
      </div>
    </section>

    <!-- 无照片提示页 -->
    <section id="screen-setup" class="screen">
      <h1 class="title">📷 还没有照片</h1>
      <p class="subtitle">把机器人照片放进 photos/ 文件夹，并在 data/photos.js 里登记顺序。<br>或者先试玩一下界面：</p>
      <button class="btn" id="btn-try">用占位图试玩 10 题</button>
      <button class="btn secondary" id="btn-back">返回</button>
    </section>

    <!-- 答题页 -->
    <section id="screen-quiz" class="screen">
      <div class="status">
        <div class="meta">
          <span id="q-brand" class="q-brand"></span>
          <span id="q-progress">第 1/10 题</span>
          <span>得分 <span class="score" id="q-score">0</span></span>
        </div>
        <div class="bar"><div id="q-bar"></div></div>
        <button class="btn-link" id="btn-quit">退出</button>
      </div>
      <div class="photo-box">
        <img id="quiz-photo" alt="机器人照片">
        <div class="placeholder" id="photo-placeholder">
          <span class="pno" id="ph-no"></span>
          <span class="pmodel" id="ph-model"></span>
        </div>
      </div>
      <p class="question">这张是什么机器人？</p>
      <div class="options" id="q-options"></div>
      <div class="feedback" id="feedback">
        <div class="fb-title" id="fb-title"></div>
        <div class="fb-ans" id="fb-ans"></div>
        <div class="fb-feature" id="fb-feature"></div>
        <button class="btn" id="btn-next">下一题</button>
      </div>
    </section>

    <!-- 结果页 -->
    <section id="screen-result" class="screen">
      <h1 class="title">🎉 完成！</h1>
      <div class="result-num" id="r-score">0</div>
      <p class="result-sub" id="r-sub"></p>
      <button class="btn" id="btn-restart">再来一局</button>
    </section>

  </div>

  <script src="data/robots.js"></script>
  <script src="data/photos.js"></script>
  <script src="js/quiz.js"></script>
  <script>
    (function () {
      'use strict';
      const $ = id => document.getElementById(id);
      const TRIAL_COUNT = 10;

      const state = { order: [], index: 0, score: 0, correctCount: 0 };

      function show(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        $(id).classList.add('active');
      }

      // 试玩：随机抽 10 台
      function trialOrder() {
        return Quiz.shuffle(ROBOTS).slice(0, TRIAL_COUNT);
      }

      function renderStatus() {
        $('q-brand').textContent = state.brand;
        $('q-progress').textContent = `第 ${state.index + 1}/${state.order.length} 题`;
        $('q-score').textContent = state.score;
        $('q-bar').style.width = (state.index / state.order.length * 100) + '%';
      }

      // 通用：把机器人的照片画进指定的图片/占位元素（答题页和学习模式共用）
      function paintRobotPhoto(img, ph, noEl, modelEl, robot, photoFile) {
        noEl.textContent = robot.no;
        modelEl.textContent = robot.model;
        if (photoFile) {
          img.onload = () => { img.style.display = 'block'; ph.style.display = 'none'; };
          img.onerror = () => { img.style.display = 'none'; ph.style.display = 'flex'; };
          img.src = 'photos/' + photoFile;
        } else {
          img.style.display = 'none';
          ph.style.display = 'flex';
        }
      }

      function renderPhoto(robot) {
        paintRobotPhoto($('quiz-photo'), $('photo-placeholder'), $('ph-no'), $('ph-model'), robot, state.photoFile);
      }

      function renderQuestion() {
        const robot = state.order[state.index];
        state.photoFile = state.photoFiles ? state.photoFiles[state.index] : '';
        state.correctIndex = -1;
        $('feedback').className = 'feedback';
        renderStatus();
        renderPhoto(robot);

        const opts = Quiz.makeOptions(robot, ROBOTS, 3, true);
        state.correctIndex = opts.findIndex(o => o.no === robot.no);

        const box = $('q-options');
        box.innerHTML = '';
        const letters = ['A', 'B', 'C', 'D'];
        opts.forEach((o, i) => {
          const btn = document.createElement('button');
          btn.className = 'option';
          btn.innerHTML =
            '<span class="letter">' + letters[i] + '</span>' +
            '<span class="txt"><span class="m">' + o.model + '</span><span class="b">' + o.brand + '</span></span>';
          btn.addEventListener('click', () => answer(i));
          box.appendChild(btn);
        });
      }

      function answer(i) {
        const buttons = document.querySelectorAll('.option');
        buttons.forEach(b => { b.disabled = true; });
        const isRight = i === state.correctIndex;
        buttons[i].classList.add(isRight ? 'correct' : 'wrong');
        if (!isRight) buttons[state.correctIndex].classList.add('correct');
        buttons.forEach((b, k) => { if (k !== i && k !== state.correctIndex) b.classList.add('dim'); });

        const robot = state.order[state.index];
        if (isRight) {
          state.score += 10;
          state.correctCount += 1;
        }
        renderStatus();
        showFeedback(isRight, robot);
      }

      function showFeedback(isRight, robot) {
        const fb = $('feedback');
        fb.className = 'feedback ' + (isRight ? 'right' : 'wrong');
        $('fb-title').textContent = isRight ? '✓ 答对了！' : '✗ 答错了';
        $('fb-ans').textContent = '正确答案：' + robot.brand + ' ' + robot.model;
        $('fb-feature').textContent = robot.feature ? robot.feature : '（暂无一句话特点）';
        $('btn-next').textContent = state.index + 1 >= state.order.length ? '查看结果' : '下一题';
      }

      function next() {
        state.index += 1;
        if (state.index >= state.order.length) {
          showResult();
        } else {
          renderQuestion();
        }
      }

      function showResult() {
        $('r-score').textContent = state.score;
        $('r-sub').textContent = `共 ${state.order.length} 题，答对 ${state.correctCount} 题`;
        show('screen-result');
      }

      function startQuiz(order, photoFiles, brand) {
        state.order = order;
        state.photoFiles = photoFiles || null;
        state.brand = brand || '';
        state.index = 0;
        state.score = 0;
        state.correctCount = 0;
        show('screen-quiz');
        renderQuestion();
      }

      // ---- 品牌选择 ----
      let mode = 'exam';      // 'study' | 'exam'
      let curBrand = '';

      // 某品牌有照片的机型，按照片清单顺序
      function orderForBrand(brand) {
        if (!PHOTO_LIST.length) return null;
        const byNo = new Map(ROBOTS.map(r => [r.no, r]));
        const files = PHOTO_LIST.filter(f => {
          const r = byNo.get(f.replace(/\.[^.]+$/, ''));
          return r && r.brand === brand;
        });
        const q = Quiz.buildOrder(files, ROBOTS);
        return q.order.length ? q : null;
      }

      // 有照片的品牌清单，按台数从多到少
      function brandList() {
        const byNo = new Map(ROBOTS.map(r => [r.no, r]));
        const counts = {};
        for (const f of PHOTO_LIST) {
          const r = byNo.get(f.replace(/\.[^.]+$/, ''));
          if (r) counts[r.brand] = (counts[r.brand] || 0) + 1;
        }
        return Object.entries(counts)
          .map(([brand, count]) => ({ brand, count }))
          .sort((a, b) => b.count - a.count);
      }

      function renderBrandPage() {
        $('b-title').textContent = '选择品牌 · ' + (mode === 'study' ? '学习' : '考试') + '模式';
        const grid = $('b-grid');
        grid.innerHTML = '';
        brandList().forEach(({ brand, count }) => {
          const btn = document.createElement('button');
          btn.className = 'brand-btn';
          btn.innerHTML = '<span class="name">' + brand + '</span><span class="count">' + count + ' 台</span>';
          btn.addEventListener('click', () => {
            curBrand = brand;
            if (mode === 'study') enterStudy(brand);
            else enterExam(brand);
          });
          grid.appendChild(btn);
        });
      }

      function enterExam(brand) {
        const q = orderForBrand(brand);
        if (!q) { show('screen-setup'); return; }
        startQuiz(q.order, q.photoFiles, brand);
      }

      // ---- 学习模式（图鉴翻卡）----
      const study = { order: [], photoFiles: [], index: 0 };

      function enterStudy(brand) {
        const q = orderForBrand(brand);
        if (!q) { show('screen-setup'); return; }
        study.order = q.order;
        study.photoFiles = q.photoFiles;
        study.index = 0;
        show('screen-study');
        renderStudy();
      }

      function renderStudy() {
        const robot = study.order[study.index];
        $('s-progress').textContent = `${curBrand} · 第 ${study.index + 1}/${study.order.length} 台`;
        paintRobotPhoto($('study-photo'), $('study-placeholder'), $('s-no'), $('s-model'), robot, study.photoFiles[study.index]);
        $('s-name').textContent = robot.brand + ' ' + robot.model;
        const tags = [robot.category, robot.subcategory].filter(Boolean);
        $('s-tags').innerHTML = tags.map(t => '<span class="tag">' + t + '</span>').join('');
        $('s-feature').textContent = robot.feature ? robot.feature : '（暂无一句话特点）';
      }

      function studyMove(delta) {
        const n = study.order.length;
        study.index = (study.index + delta + n) % n;
        renderStudy();
      }

      $('btn-learn').addEventListener('click', () => {
        mode = 'study';
        renderBrandPage();
        show('screen-brands');
      });
      $('btn-start').addEventListener('click', () => {
        mode = 'exam';
        renderBrandPage();
        show('screen-brands');
      });
      $('btn-brands-back').addEventListener('click', () => show('screen-start'));
      $('btn-quit').addEventListener('click', () => show('screen-brands'));
      $('btn-study-back').addEventListener('click', () => show('screen-brands'));
      $('btn-s-prev').addEventListener('click', () => studyMove(-1));
      $('btn-s-next').addEventListener('click', () => studyMove(1));

      $('btn-try').addEventListener('click', () => startQuiz(trialOrder(), null, '试玩'));
      $('btn-back').addEventListener('click', () => show('screen-start'));
      $('btn-next').addEventListener('click', next);
      $('btn-restart').addEventListener('click', () => show('screen-start'));
    })();
  </script>
</body>
</html>
