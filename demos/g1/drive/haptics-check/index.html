<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>G1 · 电脑手柄震动测试</title><link rel="icon" href="data:,">
  <style>
    *{box-sizing:border-box}body{margin:0;background:#edf3eb;color:#214c3f;font:17px/1.6 system-ui,"Microsoft YaHei",sans-serif;min-height:100vh;display:grid;place-items:center;padding:26px}
    main{width:min(760px,100%)}a{color:inherit;font-size:14px}header{margin:24px 0}header small{letter-spacing:.16em;font-size:12px;color:#64806f}h1{font-size:36px;line-height:1.3;margin:10px 0}p{margin:10px 0;color:#587261}
    section{border:1px solid #c2d1be;background:#f8faf3;border-radius:12px;padding:26px}label{display:block;margin:18px 0 8px;font-size:14px}select{width:100%;min-height:45px;background:#fff;color:inherit;border:1px solid #c2d1be;border-radius:6px;padding:8px;font:inherit;font-size:15px}
    #connection{font-size:22px;font-weight:600}#detail,#input{font-size:14px;color:#64806f;overflow-wrap:anywhere}#input{min-height:23px}#result{background:#e7eedf;min-height:88px;padding:16px;border-radius:6px;margin:20px 0;color:#2b5642}
    .actions{display:flex;gap:12px;flex-wrap:wrap}button{font:inherit;cursor:pointer;min-height:48px;padding:10px 20px;border:1px solid #b6c9b0;border-radius:6px;background:transparent;color:inherit}#test,#felt{background:#245b45;color:white;border-color:#245b45}button:disabled{opacity:.5;cursor:default}#confirmation{margin-top:20px;border-top:1px solid #d6dfd0;padding-top:18px}small.note{display:block;margin-top:20px;color:#718172;font-size:13px}[hidden]{display:none!important}
    @media(max-width:600px){body{padding:16px}h1{font-size:27px}section{padding:18px}}
  </style>
</head>
<body>
<main>
  <a href="../">← 返回 G1 驾驶体验</a>
  <header><small>G1 LAB / CONTROLLER FEEDBACK</small><h1>让手柄回应你</h1><p>先确认电脑能否让实体手柄震动，再接入撞墙与落地反馈。</p></header>
  <section>
    <div id="connection" role="status">等待手柄</div>
    <p id="detail">点击此页后，按一次实体手柄 A 键并松开。</p>
    <label for="device">当前测试手柄</label><select id="device"><option value="">等待手柄</option></select>
    <p>实时按键：<span id="input">未按键</span></p>
    <div id="result" role="status" aria-live="polite">等待手柄接入后再测试。</div>
    <div class="actions"><button id="test" disabled>测试震动 · 0.3 秒</button><button id="stop">停止震动</button></div>
    <div id="confirmation" hidden><p>手里是否感觉到震动？</p><div class="actions"><button id="felt">感觉到了</button><button id="not-felt">没有震动</button></div></div>
    <small class="note">浏览器返回“完成”仅代表指令执行结果，实际效果请以手里的感觉为准。切到其他窗口会停止测试。本页仅用于本地测试，未接入游戏自动震动。</small>
  </section>
</main>
<script src="app.js?v=2026-11-09-haptics-1" defer></script>
</body>
</html>
